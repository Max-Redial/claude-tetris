name: Claude Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analyze GitHub issue #${{ github.event.issue.number }} in this repo
            (title, body, and existing comments).

            1. Apply the most fitting label(s) from the repo's existing label
               set (e.g. bug, enhancement, question, documentation, duplicate,
               invalid, wontfix, good first issue, help wanted). Only use
               labels that already exist on the repo. Add/remove labels as
               needed to keep them accurate.
            2. Post a comment with a short diagnosis: what the issue is
               about, likely cause if it's a bug (referencing relevant code
               in game.js if applicable), and suggested next step.

            Keep the comment concise (a few sentences to a short paragraph).
          claude_args: |
            --allowedTools "mcp__github__update_issue,mcp__github__add_issue_comment,mcp__github__get_issue,mcp__github__get_issue_comments,Read,Grep,Glob"
